components:
  securitySchemes:
    EmailSession:
      type: apiKey
      in: cookie
      name: iljin_session
      description: |
        로그인 성공 시 발급하는 HttpOnly, Secure, SameSite=Lax 불투명 세션이다.
        D1에는 원문 토큰이 아닌 SHA-256 해시와 만료 시각만 저장한다.
        서버는 연결된 이메일의 Profile에서 tenantId, department, groups, role을
        결정하며 일반 Client가 보낸 Tenant·부서·Role 값은 권한 결정에 사용하지 않는다.

  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: |
        호출자 상관관계 ID. 없으면 서버가 새 ID를 생성한다. 서버는 정상·오류
        응답의 `X-Trace-Id` Header와 오류 Body의 `trace_id`에 동일 값을 반환한다.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: TRC-26-0722-1842
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: SSE 재연결 시 마지막으로 처리한 정수 Event ID
      schema:
        type: string
        pattern: '^[0-9]+$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Asset ID
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Conversation ID
    MessageId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Message ID
    IndexJobId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Index Job ID
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 요청 대상 자원 ID

  headers:
    TraceId:
      description: 요청과 로그를 연결하는 Trace ID
      schema:
        type: string

  responses:
    BadRequest:
      description: 요청 형식 또는 값 오류
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 로그인 세션이 없거나 유효하지 않음
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_UNAUTHORIZED
              message: 로그인된 사용자 정보를 확인할 수 없습니다.
              trace_id: TRC-01
    Forbidden:
      description: 인증됐지만 Role 또는 자원 권한이 부족함
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_FORBIDDEN
              message: 이 작업을 수행할 권한이 없습니다.
              trace_id: TRC-01
    NotFound:
      description: 자원이 없거나 Principal이 접근할 수 없어 존재를 숨김
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 현재 자원 상태와 요청이 충돌함
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 문서 또는 대화 Context가 허용 크기를 초과함
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 지원하지 않는 문서 유형
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InsufficientEvidence:
      description: Principal 권한 범위에서 충분한 근거를 찾지 못해 생성 중단
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_EVIDENCE
              message: 권한 범위에서 충분한 근거를 찾지 못해 답변 생성을 중단했습니다.
              retryable: false
              trace_id: TRC-01
    RateLimited:
      description: 호출 한도 초과
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          description: 재시도까지 대기할 초
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: 하위 Provider 응답 오류
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 저장소 또는 Provider가 준비되지 않음
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: 하위 Provider Timeout
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
              default: false
            trace_id:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true

    AccessUser:
      type: object
      required: [email, displayName, tenantId, department, groups, role, status, createdAt, updatedAt]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        tenantId:
          type: string
        department:
          type: string
        groups:
          type: array
          items:
            type: string
        role:
          type: string
          enum: [user, manager, admin]
        status:
          type: string
          enum: [unrequested, pending, approved, rejected]
        approvalRequestedAt:
          type: string
          format: date-time
        applicationNote:
          type: string
          maxLength: 1000
        approvedBy:
          type: string
        approvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AccessApplication:
      type: object
      required: [department]
      properties:
        department:
          type: string
          minLength: 1
          maxLength: 120
        note:
          type: string
          maxLength: 1000

    AccessReview:
      type: object
      required: [email, decision]
      properties:
        email:
          type: string
          format: email
        decision:
          type: string
          enum: [approved, rejected]
        department:
          type: string
          maxLength: 120
        role:
          type: string
          enum: [user, manager]
        reason:
          type: string
          maxLength: 500

    HealthResponse:
      type: object
      required: [status, runtime, gateway, rag, auth, trace_id, checked_at]
      properties:
        status:
          type: string
          enum: [ready, degraded, configuration_required]
        runtime:
          type: string
          const: cloudflare-worker
        gateway:
          $ref: '#/components/schemas/GatewayStatus'
        rag:
          $ref: '#/components/schemas/RagStatus'
        auth:
          type: object
          required: [mode, credentialStore, sessionCookie, approvalRequired]
          properties:
            mode:
              type: string
              const: email-password-session
            credentialStore:
              type: string
              const: cloudflare-d1
            sessionCookie:
              type: string
              const: httpOnly-secure-sameSite-lax
            approvalRequired:
              type: boolean
              const: true
        trace_id:
          type: string
        checked_at:
          type: string
          format: date-time

    GatewayStatus:
      type: object
      required: [provider, model, configured, endpointConfigured, residency, transport]
      properties:
        provider:
          type: string
          enum: [local, cloudflare]
          example: cloudflare
        model:
          type: string
          example: gemma-4-31b
        configured:
          type: boolean
        endpointConfigured:
          type: boolean
        residency:
          type: string
          example: KR
        transport:
          type: string

    RagStatus:
      type: object
      required:
        - d1Configured
        - r2Configured
        - embeddingConfigured
        - rerankConfigured
        - embeddingModel
        - rerankModel
        - strategy
      properties:
        d1Configured:
          type: boolean
        r2Configured:
          type: boolean
        embeddingConfigured:
          type: boolean
        rerankConfigured:
          type: boolean
        embeddingModel:
          type: string
        rerankModel:
          type: string
        strategy:
          type: string

    Classification:
      type: string
      enum: [public, internal, confidential]

    Asset:
      type: object
      required:
        - id
        - title
        - source_type
        - mime_type
        - status
        - classification
        - department_scope
        - version
        - segment_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        source_type:
          type: string
        mime_type:
          type: string
        status:
          type: string
          enum: [received, indexing, indexed, failed, deleted]
        classification:
          $ref: '#/components/schemas/Classification'
        department_scope:
          type: string
          description: 쉼표 구분 부서 Scope. 일반 사용자 요청으로 확장할 수 없다.
        version:
          type: integer
          minimum: 1
        segment_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AssetUploadForm:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: 현재 TXT, Markdown, CSV, JSON 지원
        title:
          type: string
          maxLength: 200
        classification:
          $ref: '#/components/schemas/Classification'
        department_scope:
          type: string
          description: 관리자 전용 쉼표 구분 부서 목록. 일반 사용자는 무시된다.

    AssetCreateJson:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 500000
        mimeType:
          type: string
          default: text/plain
        sourceType:
          type: string
          default: upload
        classification:
          $ref: '#/components/schemas/Classification'
        departmentScope:
          type: array
          description: 관리자 전용. 일반 사용자는 무시된다.
          items:
            type: string

    AssetPatch:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        classification:
          $ref: '#/components/schemas/Classification'
        departmentScope:
          type: array
          description: 관리자만 변경 가능
          items:
            type: string

    IndexResult:
      type: object
      required: [assetId, status, segmentCount, checksum, embeddingModel, deduplicated]
      properties:
        assetId:
          type: string
        jobId:
          type: [string, 'null']
        status:
          type: string
          const: indexed
        segmentCount:
          type: integer
        checksum:
          type: string
        embeddingModel:
          type: string
        deduplicated:
          type: boolean

    ReindexResult:
      type: object
      required: [assetId, jobId, status, version, segmentCount]
      properties:
        assetId:
          type: string
        jobId:
          type: string
        status:
          type: string
          const: indexed
        version:
          type: integer
          minimum: 1
        segmentCount:
          type: integer
          minimum: 0

    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 2000
        limit:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        sourceType:
          type: string
          description: source_type 정확 일치 필터
        createdFrom:
          type: string
          format: date-time
        createdTo:
          type: string
          format: date-time

    SearchResponse:
      type: object
      required: [query, grounded, citations, traceId, latencyMs, retrieval]
      properties:
        query:
          type: string
        grounded:
          type: boolean
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RagCitation'
        traceId:
          type: string
        latencyMs:
          type: integer
          minimum: 0
        retrieval:
          $ref: '#/components/schemas/RetrievalInfo'

    RagCitation:
      type: object
      required:
        - id
        - assetId
        - segmentId
        - title
        - version
        - excerpt
        - score
        - lexicalScore
        - denseScore
      properties:
        id:
          type: string
          example: S1
        assetId:
          type: string
        segmentId:
          type: string
        title:
          type: string
        version:
          type: integer
          minimum: 1
        heading:
          type: string
        pageNumber:
          type: integer
          minimum: 1
        excerpt:
          type: string
        score:
          type: number
          minimum: 0
        lexicalScore:
          type: number
          minimum: 0
        denseScore:
          type: number
        rerankScore:
          type: number

    RetrievalInfo:
      type: object
      required: [strategy, embeddingModel, candidateCount]
      properties:
        strategy:
          type: string
          const: hybrid
        embeddingModel:
          type: string
        rerankModel:
          type: string
        candidateCount:
          type: integer
          minimum: 0

    CitationDetail:
      type: object
      required:
        - segment_id
        - asset_id
        - title
        - version
        - mime_type
        - classification
        - content
        - char_start
        - char_end
      properties:
        segment_id:
          type: string
        asset_id:
          type: string
        title:
          type: string
        version:
          type: integer
        mime_type:
          type: string
        classification:
          $ref: '#/components/schemas/Classification'
        heading:
          type: [string, 'null']
        content:
          type: string
        page_number:
          type: [integer, 'null']
        char_start:
          type: integer
        char_end:
          type: integer

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 8000

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        sensitivity:
          $ref: '#/components/schemas/Classification'
        rag:
          type: boolean
          default: true
          description: false는 Admin Role에만 허용
        conversation_id:
          type: string
          description: 없으면 서버가 새 대화를 생성

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - provider
        - residency
        - choices
        - trace_id
        - latency_ms
        - grounded
        - citations
        - conversation_id
        - message_id
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
        provider:
          type: string
        residency:
          type: string
          example: KR
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                    const: assistant
                  content:
                    type: string
              finish_reason:
                type: string
        usage:
          $ref: '#/components/schemas/TokenUsage'
        trace_id:
          type: string
        latency_ms:
          type: integer
        grounded:
          type: boolean
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RagCitation'
        retrieval:
          $ref: '#/components/schemas/RetrievalInfo'
        retrieval_latency_ms:
          type: integer
        conversation_id:
          type: string
        message_id:
          type: string

    TokenUsage:
      type: object
      properties:
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        total_tokens:
          type: integer

    ConversationSummary:
      type: object
      required: [id, title, status, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [active, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationDetail:
      allOf:
        - $ref: '#/components/schemas/ConversationSummary'
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: '#/components/schemas/StoredMessage'

    StoredMessage:
      type: object
      required: [id, role, content, created_at]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        usage:
          $ref: '#/components/schemas/TokenUsage'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RagCitation'
        created_at:
          type: string
          format: date-time

    FeedbackRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          enum: [-1, 1]
        comment:
          type: string
          maxLength: 1000

    IndexJob:
      type: object
      required: [id, status, stage, attempt_count, created_at]
      properties:
        id:
          type: string
        asset_id:
          type: [string, 'null']
        title:
          type: [string, 'null']
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        stage:
          type: string
        error_code:
          type: [string, 'null']
        attempt_count:
          type: integer
        started_at:
          type: [string, 'null']
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time

    ProviderStatus:
      type: object
      required: [id, name, model, status, residency, transport, role, order, primary, fallback]
      properties:
        id:
          type: string
        name:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [configured, configuration_required]
        residency:
          type: string
        transport:
          type: string
        role:
          type: string
          enum: [primary, secondary, fallback]
        order:
          type: integer
          minimum: 1
          maximum: 3
        primary:
          type: boolean
        fallback:
          type: boolean

    AgentRunRequest:
      type: object
      required: [objective]
      properties:
        objective:
          type: string
          minLength: 2
          maxLength: 2000
        tool_id:
          type: string
          description: 생략하면 Router가 목표를 분석해 built-in Tool을 선택
        tool_input:
          type: object
          additionalProperties: true

    AgentRunSummary:
      type: object
      required: [id, title, objective, status, currentState, maxIterations, iterationCount, traceId, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        objective:
          type: string
        status:
          type: string
          enum: [queued, running, awaiting_approval, completed, failed, cancelled]
        currentState:
          type: string
          enum: [router, planner, retrieval, verification, execution]
        selectedToolId:
          type: string
        maxIterations:
          type: integer
          maximum: 5
        iterationCount:
          type: integer
        output:
          type: object
          additionalProperties: true
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    AgentRunDetail:
      allOf:
        - $ref: '#/components/schemas/AgentRunSummary'
        - type: object
          required: [steps, approvals, executions]
          properties:
            steps:
              type: array
              items:
                $ref: '#/components/schemas/AgentStep'
            approvals:
              type: array
              items:
                $ref: '#/components/schemas/ToolApproval'
            executions:
              type: array
              items:
                type: object
                additionalProperties: true

    AgentStep:
      type: object
      required: [id, sequence, stepType, status]
      properties:
        id:
          type: string
        sequence:
          type: integer
          minimum: 1
          maximum: 5
        stepType:
          type: string
          enum: [router, planner, retrieval, verification, execution]
        status:
          type: string
          enum: [queued, running, waiting_approval, completed, failed, cancelled]
        toolId:
          type: string
        output:
          type: object
          additionalProperties: true

    ToolDefinition:
      type: object
      required: [id, name, description, riskLevel, mode, adapterType, enabled, approvalRequired, availableToCurrentRole, timeoutMs, maxRetries]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        riskLevel:
          type: string
          enum: [R0, R1, R2, R3]
        mode:
          type: string
          enum: [read_only, write]
        adapterType:
          type: string
          enum: [builtin, external]
        enabled:
          type: boolean
        approvalRequired:
          type: boolean
        availableToCurrentRole:
          type: boolean
        timeoutMs:
          type: integer
        maxRetries:
          type: integer
          maximum: 2
        inputSchema:
          type: object
          additionalProperties: true

    ToolApproval:
      type: object
      required: [id, runId, stepId, toolId, toolName, riskLevel, mode, requesterEmail, status, reason, expiresAt, createdAt]
      properties:
        id:
          type: string
        runId:
          type: string
        stepId:
          type: string
        toolId:
          type: string
        toolName:
          type: string
        riskLevel:
          type: string
          enum: [R2, R3]
        mode:
          type: string
          enum: [read_only, write]
        requesterEmail:
          type: string
          format: email
        objective:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, expired, consumed]
        reason:
          type: string
        input:
          type: object
          additionalProperties: true
        decisionBy:
          type: string
          format: email
        decisionNote:
          type: string
        decidedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
