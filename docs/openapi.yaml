openapi: 3.1.0
info:
  title: ILJIN AI Works API
  version: 0.3.0
  summary: Enterprise Document RAG, Agent 및 AI 업무 Portal API 계약
  description: |
    현재 구현된 Document RAG API와 이번 단계에서 추가되는 자산 수명주기,
    대화, 피드백, 제한 반복 Agent, Tool 실행 승인 및 관리자 API의 단일 계약이다.

    인증은 D1에 저장된 PBKDF2-SHA256 이메일 자격증명과 해시된 불투명 세션으로
    수행한다. 브라우저에는 HttpOnly, Secure, SameSite=Lax 쿠키만 전달한다.
    Tenant, 부서, 그룹, Role은
    요청 Body나 일반 클라이언트 Header에서 받지 않고 서버의 사용자 Profile로
    결정한다. 따라서 `department`, `tenant_id`, `role`을 요청에 넣어 권한을
    변경하는 계약은 제공하지 않는다.

    `x-implementation-status` 값은 `current`(기존 공개 계약) 또는
    `new`(이번 단계에서 추가되는 계약)를 뜻한다.
servers:
  - url: /
    description: 현재 Origin
tags:
  - name: Health
  - name: Auth
  - name: Assets
  - name: Search
  - name: Citations
  - name: Chat
  - name: Conversations
  - name: Feedback
  - name: Agents
  - name: Tools
  - name: Tool Approvals
  - name: Admin
  - name: Operations
security:
  - EmailSession: []

paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 서비스와 RAG Provider 준비 상태 조회
      x-implementation-status: current
      security: []
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 모든 필수 구성요소가 준비됨
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 일부 또는 전체 필수 구성요소가 준비되지 않음
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerEmailAccount
      summary: 이메일 계정 생성 및 가입 신청
      security: []
      x-implementation-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName, department]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
                displayName: { type: string, minLength: 1, maxLength: 120 }
                department: { type: string, minLength: 1, maxLength: 120 }
                note: { type: string, maxLength: 1000 }
                adminCode: { type: string, format: password, maxLength: 256 }
      responses:
        '201':
          description: 계정과 가입 신청 생성, 세션 쿠키 발급
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이미 가입된 이메일

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginEmailAccount
      summary: 이메일과 비밀번호로 로그인
      security: []
      x-implementation-status: current
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: 로그인 성공 및 세션 쿠키 발급
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutEmailAccount
      summary: 현재 세션 폐기
      x-implementation-status: current
      responses:
        '200':
          description: 서버 세션과 브라우저 쿠키 폐기

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentAccessIdentity
      summary: 현재 로그인 사용자의 접근 승인 상태 조회
      description: 승인 대기와 거절 상태도 200 응답으로 반환하며 업무 API 접근은 별도로 차단한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 로그인 사용자와 승인 상태
          content:
            application/json:
              schema:
                type: object
                required: [user, can_access, trace_id]
                properties:
                  user:
                    $ref: '#/components/schemas/AccessUser'
                  can_access:
                    type: boolean
                  trace_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/application:
    post:
      tags: [Auth]
      operationId: submitAccessApplication
      summary: 인증 이메일 사용자의 가입 신청 또는 재신청
      description: 희망 부서와 신청 사유를 저장하고 사용자를 관리자 승인 대기 상태로 전환한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessApplication'
      responses:
        '201':
          description: 가입 신청 접수
          content:
            application/json:
              schema:
                type: object
                required: [user, trace_id]
                properties:
                  user:
                    $ref: '#/components/schemas/AccessUser'
                  trace_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/access-requests:
    get:
      tags: [Admin]
      operationId: listAccessRequests
      summary: 사용자 접근 요청과 승인 상태 목록 조회
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: 동일 Tenant의 비관리자 접근 요청 목록
          content:
            application/json:
              schema:
                type: object
                required: [items, trace_id]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessUser'
                  trace_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      operationId: reviewAccessRequest
      summary: 관리자가 사용자 접근 요청을 승인 또는 거절
      description: 부서와 사용자/매니저 역할을 함께 지정하며 처리 결과는 감사 로그에 저장한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessReview'
      responses:
        '200':
          description: 변경된 사용자 승인 상태
          content:
            application/json:
              schema:
                type: object
                required: [user, trace_id]
                properties:
                  user:
                    $ref: '#/components/schemas/AccessUser'
                  trace_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: Principal이 접근할 수 있는 문서 자산 목록 조회
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 접근 가능한 자산 목록
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Assets]
      operationId: createAsset
      summary: 문서 등록, 청킹, 임베딩 및 색인
      description: |
        일반 사용자의 `departmentScope`는 무시하고 Principal 부서를 적용한다.
        관리자는 명시적으로 여러 부서 Scope를 지정할 수 있다. 동일 Tenant에서
        동일 Checksum의 활성 문서가 있으면 기존 자산을 반환한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetUploadForm'
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateJson'
      responses:
        '201':
          description: 자산 색인 완료 또는 기존 중복 자산 반환
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/assets/{id}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: 자산 상세 조회
      x-implementation-status: new
      responses:
        '200':
          description: 접근 가능한 자산
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: 자산 Metadata와 ACL Scope 수정
      description: 소유자 또는 관리자만 수정할 수 있으며 부서 Scope 변경은 관리자만 가능하다.
      x-implementation-status: new
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetPatch'
      responses:
        '200':
          description: 수정된 자산
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: 자산과 파생 Segment를 삭제하고 진행 중 Job을 취소
      description: 소유자 또는 관리자만 삭제할 수 있다. R2 원본도 함께 삭제한다.
      x-implementation-status: new
      responses:
        '204':
          description: 삭제 완료
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/assets/{id}/reindex:
    post:
      tags: [Assets]
      operationId: reindexAsset
      summary: 저장된 원본으로 자산 재색인
      x-implementation-status: new
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/TraceId'
      responses:
        '202':
          description: 재색인 완료 결과
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReindexResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/search:
    post:
      tags: [Search]
      operationId: searchDocuments
      summary: Principal ACL 기반 Hybrid Search 및 재정렬
      description: |
        Tenant와 부서는 인증 Principal에서 결정한다. 요청의 검색 조건은 결과를
        좁히기만 하며 Principal 권한 범위를 확장하지 못한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Hybrid Search 결과
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            X-Search-Strategy:
              description: 적용 검색 전략
              schema:
                type: string
                const: hybrid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/citations:
    get:
      tags: [Citations]
      operationId: getCitation
      summary: 최신 Principal ACL로 Segment 근거 재검증
      description: 비인가 근거는 존재 여부를 노출하지 않도록 404로 응답한다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - name: asset_id
          in: query
          required: true
          schema:
            type: string
          description: Asset ID
        - name: segment_id
          in: query
          required: true
          schema:
            type: string
          description: Segment ID
      responses:
        '200':
          description: 접근 가능한 Citation 근거
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/chat/completions:
    post:
      tags: [Chat]
      operationId: createChatCompletion
      summary: 근거 기반 Chat 완료 또는 SSE Event Stream 생성
      description: |
        기본값은 RAG 활성화이다. `rag=false`는 관리자에게만 허용한다.
        `stream=true`이면 `delta`, `citation`, `done`, `error` 이벤트를
        `text/event-stream`으로 반환하며 `Last-Event-ID` 재개를 지원한다.
      x-implementation-status: current
      x-capability-status:
        application-json: current
        text-event-stream: new
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/LastEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: JSON 완료 또는 SSE Stream
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
              examples:
                stream:
                  summary: SSE 이벤트 예시
                  value: |
                    event: delta
                    id: 1
                    data: {"text":"Document RAG는 "}

                    event: citation
                    id: 2
                    data: {"id":"S1","assetId":"ast_01","segmentId":"seg_01"}

                    event: done
                    id: 3
                    data: {"message_id":"msg_01","conversation_id":"conv_01","trace_id":"TRC-01"}

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/InsufficientEvidence'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: 내 활성 대화 목록 조회
      x-implementation-status: new
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 내 대화 목록
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: 새 대화 생성
      x-implementation-status: new
      parameters:
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 120
      responses:
        '201':
          description: 생성된 대화 ID
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [conversation_id]
                properties:
                  conversation_id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/TraceId'
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: 대화와 메시지 조회
      x-implementation-status: new
      responses:
        '200':
          description: 소유한 대화와 메시지
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Conversations]
      operationId: deleteConversation
      summary: 대화 논리 삭제
      x-implementation-status: new
      responses:
        '204':
          description: 삭제 완료
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/messages/{id}/feedback:
    post:
      tags: [Feedback]
      operationId: createMessageFeedback
      summary: 내 Assistant 메시지에 피드백 등록
      x-implementation-status: new
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/TraceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: 저장된 피드백 ID
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: object
                required: [feedback_id]
                properties:
                  feedback_id:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agent/runs:
    get:
      tags: [Agents]
      operationId: listAgentRuns
      summary: 사용자 Agent 실행 이력 조회
      description: 일반 사용자는 자신의 실행만 조회하며 manager/admin은 `scope=tenant`로 Tenant 실행을 조회할 수 있다.
      x-implementation-status: current
      parameters:
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: scope
          schema:
            type: string
